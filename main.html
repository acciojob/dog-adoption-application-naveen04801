	<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dog Adoption Application</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <form>

        <h1>Dog Adoption Application</h1>

        <label for="name">Name</label>
        <input
            type="text"
            id="name"
            name="name"
            placeholder="Name"
        >

        <label for="phone">Phone Number</label>
      <input type="tel" id="phone" name="phone" placeholder="Phone Number">

        <label id ="add" for="address">Address</label>
        <input
            type="text"
            id="address"
            name="address"
            placeholder="Address"
        >

        <label>
            <input
                type="checkbox"
                name="dog"
                value="Have you ever lived with a Dog before?"
            >
            Have you ever lived with a Dog before?
        </label>

        <label for="breeds">Please select your preferred breeds</label>
        <select id="breeds" name="breeds" multiple>
            <option value="Labrador">Labrador</option>
            <option value="Golden Retriever">Golden Retriever</option>
            <option value="German Shepherd">German Shepherd</option>
            <option value="Beagle">Beagle</option>
        </select>

        <input type="submit" value="Submit">

    </form>

</body>
